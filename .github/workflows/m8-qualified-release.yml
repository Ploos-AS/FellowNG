name: Qualified Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Dry-run release version identity
        required: false
        default: dry-run
        type: string
      publish:
        description: Publish a GitHub Release (tag pushes publish automatically)
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  qualify:
    uses: ./.github/workflows/m8-release-artifacts.yml
    with:
      version: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}

  publish:
    needs: qualify
    if: ${{ github.event_name == 'push' || inputs.publish }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download qualified artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: fellowng-${{ github.event_name == 'push' && github.ref_name || inputs.version }}-*
          path: dist
          merge-multiple: true

      - name: Revalidate qualified artifacts before publication
        shell: bash
        run: |
          count=0
          while IFS= read -r archive; do
            python3 tools/validate_release_archive.py "$archive"
            count=$((count + 1))
          done < <(find dist -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print)
          test "$count" -eq 4

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --verify-tag \
            --generate-notes \
            --title "FellowNG ${{ github.ref_name }}"
