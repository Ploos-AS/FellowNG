name: Qualified Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/m8-qualified-release.yml'
      - '.github/workflows/m8-release-artifacts.yml'
      - 'tools/package_release.py'
      - 'tools/validate_release_archive.py'
      - 'tools/test_release_tools.py'
  workflow_dispatch:
    inputs:
      version:
        description: Dry-run release version identity
        required: false
        default: dry-run
        type: string

permissions:
  contents: write

jobs:
  qualify:
    uses: ./.github/workflows/m8-release-artifacts.yml
    with:
      version: ${{ github.event_name == 'push' && github.ref_name || github.event_name == 'workflow_dispatch' && inputs.version || format('pr-{0}', github.event.pull_request.number) }}

  release-gate:
    needs: qualify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download qualified artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: fellowng-${{ github.event_name == 'push' && github.ref_name || github.event_name == 'workflow_dispatch' && inputs.version || format('pr-{0}', github.event.pull_request.number) }}-*
          path: dist
          merge-multiple: true

      - name: Revalidate qualified artifacts before publication
        shell: bash
        run: |
          count=0
          while IFS= read -r archive; do
            python3 tools/validate_release_archive.py "$archive"
            count=$((count + 1))
          done < <(find dist -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print)
          test "$count" -eq 4

      - name: Publish GitHub release
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --verify-tag \
            --generate-notes \
            --title "FellowNG ${{ github.ref_name }}"
