name: Qualified Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  qualify:
    uses: ./.github/workflows/m8-release-artifacts.yml
    with:
      version: ${{ github.ref_name }}

  publish:
    needs: qualify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download qualified artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: fellowng-${{ github.ref_name }}-*
          path: dist
          merge-multiple: true

      - name: Revalidate qualified artifacts before publication
        shell: bash
        run: |
          count=0
          while IFS= read -r archive; do
            python3 tools/validate_release_archive.py "$archive"
            count=$((count + 1))
          done < <(find dist -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print)
          test "$count" -eq 4

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --verify-tag \
            --generate-notes \
            --title "FellowNG ${{ github.ref_name }}"
