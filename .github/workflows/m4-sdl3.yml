name: M4 SDL3 Frontend

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  linux-sdl3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL3
        id: sdl
        uses: libsdl-org/setup-sdl@main
        with:
          version: 3.4.16
          install-linux-dependencies: true

      - name: Configure
        run: >-
          cmake -S . -B build-m4
          -DFELLOWNG_BUILD_TESTS=OFF
          -DFELLOWNG_BUILD_SDL_FRONTEND=ON
          -DCMAKE_PREFIX_PATH="${{ steps.sdl.outputs.prefix }}"

      - name: Build SDL frontend
        run: |
          set -o pipefail
          cmake --build build-m4 --parallel 2 --verbose 2>&1 | tee sdl-build.log

      - name: SDL backend self-test
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          set -o pipefail
          ./build-m4/frontend/sdl/fellowng-sdl --self-test 2>&1 | tee sdl-self-test.log

      - name: Upload SDL diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdl-diagnostics
          path: |
            sdl-build.log
            sdl-self-test.log
          if-no-files-found: warn
