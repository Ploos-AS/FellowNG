name: M4 SDL3 Frontend

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  linux-sdl3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL3
        id: sdl
        uses: libsdl-org/setup-sdl@main
        with:
          version: 3.4.16
          install-linux-dependencies: true

      - name: Configure
        run: >-
          cmake -S . -B build-m4
          -DFELLOWNG_BUILD_TESTS=OFF
          -DFELLOWNG_BUILD_SDL_FRONTEND=ON
          -DCMAKE_PREFIX_PATH="${{ steps.sdl.outputs.prefix }}"

      - name: Build SDL frontend
        run: |
          set -o pipefail
          cmake --build build-m4 --parallel 2 --verbose 2>&1 | tee sdl-build.log

      - name: SDL backend self-test
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          set -o pipefail
          ./build-m4/frontend/sdl/fellowng-sdl --self-test 2>&1 | tee sdl-self-test.log

      - name: M8.5 configuration usability regression
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          cat > fellowng-test.conf <<'EOF'
          # portable config
          cpu_type=68000
          ; another comment
          -s chipmem_size=4
          EOF
          ./build-m4/frontend/sdl/fellowng-sdl --config fellowng-test.conf --print-config -s cpu_type=68020 | tee config.log
          grep -q "config: cpu_type=68000" config.log
          grep -q "config: chipmem_size=4" config.log
          grep -q "command-line: cpu_type=68020" config.log
          set +e
          ./build-m4/frontend/sdl/fellowng-sdl --config does-not-exist.conf --print-config
          test "$?" -ne 0
          printf 'not-an-assignment\n' > fellowng-bad.conf
          ./build-m4/frontend/sdl/fellowng-sdl --config fellowng-bad.conf --print-config
          test "$?" -ne 0
          set -e

      - name: Real runtime smoke without copyrighted ROM
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          set -o pipefail
          ./build-m4/frontend/sdl/fellowng-sdl --runtime-smoke 2>&1 | tee sdl-runtime-smoke.log

      - name: Fetch official AROS m68k ROM
        run: |
          python3 tools/fetch_aros_m68k.py build-m4/aros-m68k
          test -s build-m4/aros-m68k/rom-path.txt

      - name: AROS m68k real-runtime qualification
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          set -o pipefail
          ROM="$(cat build-m4/aros-m68k/rom-path.txt)"
          EXT="$(cat build-m4/aros-m68k/ext-path.txt)"
          args=(--runtime-smoke -s "kickstart_rom_file=$ROM" -s "cpu_type=68020")
          if [ -n "$EXT" ]; then
            args+=(-s "kickstart_rom_file_ext=$EXT")
          fi
          ./build-m4/frontend/sdl/fellowng-sdl "${args[@]}" 2>&1 | tee sdl-aros-m68k.log
          grep -q "real runtime start+pump+stop PASS" sdl-aros-m68k.log

      - name: M5 CLI and JSON contract
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          set -o pipefail
          ./build-m4/frontend/sdl/fellowng-sdl --help | tee sdl-cli-help.log
          grep -q -- "--result-json" sdl-cli-help.log
          ./build-m4/frontend/sdl/fellowng-sdl --version | tee sdl-cli-version.log
          grep -q "FellowNG SDL3 frontend" sdl-cli-version.log
          ROM="$(cat build-m4/aros-m68k/rom-path.txt)"
          EXT="$(cat build-m4/aros-m68k/ext-path.txt)"
          args=(--runtime-boot --result-json -s "kickstart_rom_file=$ROM" -s "cpu_type=68020")
          if [ -n "$EXT" ]; then
            args+=(-s "kickstart_rom_file_ext=$EXT")
          fi
          timeout 30s ./build-m4/frontend/sdl/fellowng-sdl "${args[@]}" 2>&1 | tee sdl-runtime-result.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          lines = Path("sdl-runtime-result.log").read_text().splitlines()
          result = json.loads(next(line for line in reversed(lines) if line.startswith('{"schema":')))
          schema = json.loads(Path("docs/schema/runtime-result-v1.schema.json").read_text())
          assert schema["properties"]["schema"]["const"] == result["schema"]
          assert set(result) <= set(schema["properties"])
          for key in schema["required"]:
              assert key in result
          assert result["schema"] == "fellowng.runtime-result.v1"
          assert result["status"] == "pass"
          assert result["mode"] == "runtime-boot"
          assert result["pumps"] > 0
          assert result["slices"] > 0
          assert result["frames"] > 0
          PY

      - name: M5 JSON failure contract
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          set +e
          ROM="$(cat build-m4/aros-m68k/rom-path.txt)"
          EXT="$(cat build-m4/aros-m68k/ext-path.txt)"
          args=(--runtime-boot-desktop --result-json --max-pumps 1 -s "kickstart_rom_file=$ROM" -s "cpu_type=68020")
          if [ -n "$EXT" ]; then
            args+=(-s "kickstart_rom_file_ext=$EXT")
          fi
          timeout 30s ./build-m4/frontend/sdl/fellowng-sdl "${args[@]}" 2>&1 | tee sdl-runtime-failure-result.log
          rc=${PIPESTATUS[0]}
          set -e
          test "$rc" -ne 0
          python3 - <<'PY'
          import json
          from pathlib import Path
          lines = Path("sdl-runtime-failure-result.log").read_text().splitlines()
          candidates = [line for line in lines if line.startswith('{"schema":')]
          assert candidates, "expected machine-readable failure result"
          result = json.loads(candidates[-1])
          schema = json.loads(Path("docs/schema/runtime-result-v1.schema.json").read_text())
          assert schema["properties"]["schema"]["const"] == result["schema"]
          assert set(result) <= set(schema["properties"])
          for key in schema["required"]:
              assert key in result
          assert result["schema"] == "fellowng.runtime-result.v1"
          assert result["status"] == "fail"
          assert result["reason"] == "startup-failed" or result["reason"] == "progress-target-missed"
          PY

      - name: AROS m68k sustained boot qualification
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          set -o pipefail
          ROM="$(cat build-m4/aros-m68k/rom-path.txt)"
          EXT="$(cat build-m4/aros-m68k/ext-path.txt)"
          args=(--runtime-boot -s "kickstart_rom_file=$ROM" -s "cpu_type=68020")
          if [ -n "$EXT" ]; then
            args+=(-s "kickstart_rom_file_ext=$EXT")
          fi
          timeout 30s ./build-m4/frontend/sdl/fellowng-sdl "${args[@]}" 2>&1 | tee sdl-aros-m68k-boot.log
          grep -q "runtime-boot: sustained execution PASS" sdl-aros-m68k-boot.log

      - name: AROS m68k deep boot progress qualification
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          set -o pipefail
          ROM="$(cat build-m4/aros-m68k/rom-path.txt)"
          EXT="$(cat build-m4/aros-m68k/ext-path.txt)"
          args=(--runtime-boot-deep -s "kickstart_rom_file=$ROM" -s "cpu_type=68020")
          if [ -n "$EXT" ]; then
            args+=(-s "kickstart_rom_file_ext=$EXT")
          fi
          timeout 60s ./build-m4/frontend/sdl/fellowng-sdl "${args[@]}" 2>&1 | tee sdl-aros-m68k-deep-boot.log
          grep -q "runtime-boot-deep: sustained execution PASS" sdl-aros-m68k-deep-boot.log
          test -s fellowng-boot-evidence.ppm
          head -c 2 fellowng-boot-evidence.ppm | grep -q P6

      - name: AROS m68k framebuffer-progress boot qualification
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          set -o pipefail
          ROM="$(cat build-m4/aros-m68k/rom-path.txt)"
          EXT="$(cat build-m4/aros-m68k/ext-path.txt)"
          ADF="$(cat build-m4/aros-m68k/boot-adf-path.txt)"
          LIVE_ROOT="$(cat build-m4/aros-m68k/live-root-path.txt)"
          test -n "$ADF"
          test -s "$ADF"
          test -n "$LIVE_ROOT"
          test -d "$LIVE_ROOT"
          args=(--runtime-boot-desktop -s "kickstart_rom_file=$ROM" -s "cpu_type=68020" -s "floppy0=$ADF" -s "floppy0_enabled=yes" -s "floppy0_readonly=yes" -s "autoconfig=yes" -s "filesystem=ro,AROS Live CD:$LIVE_ROOT")
          if [ -n "$EXT" ]; then
            args+=(-s "kickstart_rom_file_ext=$EXT")
          fi
          set +e
          timeout 90s ./build-m4/frontend/sdl/fellowng-sdl "${args[@]}" 2>&1 | tee sdl-aros-m68k-desktop.log
          rc=${PIPESTATUS[0]}
          set -e
          test -s fellowng-desktop-evidence.ppm
          head -c 2 fellowng-desktop-evidence.ppm | grep -q P6
          if [ "$rc" -ne 0 ]; then
            echo "AROS desktop qualification failed after preserving framebuffer evidence (rc=$rc)"
            exit "$rc"
          fi
          grep -q "runtime-boot-desktop: sustained execution PASS" sdl-aros-m68k-desktop.log

      - name: M7 AROS qualification profiles
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          set -o pipefail
          python3 tools/run_qualification_profile.py \
            profiles/qualification/aros-m68k-020.json \
            --fellowng ./build-m4/frontend/sdl/fellowng-sdl \
            --assets build-m4/aros-m68k 2>&1 | tee m7-aros-m68k-020.log
          python3 tools/run_qualification_profile.py \
            profiles/qualification/aros-m68k-020-desktop.json \
            --fellowng ./build-m4/frontend/sdl/fellowng-sdl \
            --assets build-m4/aros-m68k 2>&1 | tee m7-aros-m68k-020-desktop.log

      - name: Upload SDL diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdl-diagnostics
          path: |
            sdl-build.log
            sdl-self-test.log
            sdl-runtime-smoke.log
            sdl-cli-help.log
            sdl-cli-version.log
            sdl-runtime-result.log
            sdl-runtime-failure-result.log
            sdl-aros-m68k.log
            sdl-aros-m68k-boot.log
            sdl-aros-m68k-deep-boot.log
            fellowng-boot-evidence.ppm
            sdl-aros-m68k-desktop.log
            m7-aros-m68k-020.log
            m7-aros-m68k-020-desktop.log
            fellowng-desktop-evidence.ppm
            fsysdump.txt
          if-no-files-found: warn
