name: M4 SDL3 Frontend

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  linux-sdl3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL3
        id: sdl
        uses: libsdl-org/setup-sdl@main
        with:
          version: 3.4.16
          install-linux-dependencies: true

      - name: Configure
        run: >-
          cmake -S . -B build-m4
          -DFELLOWNG_BUILD_TESTS=OFF
          -DFELLOWNG_BUILD_SDL_FRONTEND=ON
          -DCMAKE_PREFIX_PATH="${{ steps.sdl.outputs.prefix }}"

      - name: Build SDL frontend
        run: |
          set -o pipefail
          cmake --build build-m4 --parallel 2 --verbose 2>&1 | tee sdl-build.log

      - name: SDL backend self-test
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          set -o pipefail
          ./build-m4/frontend/sdl/fellowng-sdl --self-test 2>&1 | tee sdl-self-test.log

      - name: Real runtime smoke without copyrighted ROM
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          set -o pipefail
          ./build-m4/frontend/sdl/fellowng-sdl --runtime-smoke 2>&1 | tee sdl-runtime-smoke.log

      - name: Fetch official AROS m68k ROM
        run: |
          python3 tools/fetch_aros_m68k.py build-m4/aros-m68k
          test -s build-m4/aros-m68k/rom-path.txt

      - name: AROS m68k real-runtime qualification
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          set -o pipefail
          ROM="$(cat build-m4/aros-m68k/rom-path.txt)"
          EXT="$(cat build-m4/aros-m68k/ext-path.txt)"
          args=(--runtime-smoke -s "kickstart_rom_file=$ROM" -s "cpu_type=68020")
          if [ -n "$EXT" ]; then
            args+=(-s "kickstart_rom_file_ext=$EXT")
          fi
          ./build-m4/frontend/sdl/fellowng-sdl "${args[@]}" 2>&1 | tee sdl-aros-m68k.log
          grep -q "real runtime start+pump+stop PASS" sdl-aros-m68k.log

      - name: AROS m68k sustained boot qualification
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          set -o pipefail
          ROM="$(cat build-m4/aros-m68k/rom-path.txt)"
          EXT="$(cat build-m4/aros-m68k/ext-path.txt)"
          args=(--runtime-boot -s "kickstart_rom_file=$ROM" -s "cpu_type=68020")
          if [ -n "$EXT" ]; then
            args+=(-s "kickstart_rom_file_ext=$EXT")
          fi
          timeout 30s ./build-m4/frontend/sdl/fellowng-sdl "${args[@]}" 2>&1 | tee sdl-aros-m68k-boot.log
          grep -q "runtime-boot: sustained execution PASS" sdl-aros-m68k-boot.log

      - name: AROS m68k deep boot progress qualification
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          set -o pipefail
          ROM="$(cat build-m4/aros-m68k/rom-path.txt)"
          EXT="$(cat build-m4/aros-m68k/ext-path.txt)"
          args=(--runtime-boot-deep -s "kickstart_rom_file=$ROM" -s "cpu_type=68020")
          if [ -n "$EXT" ]; then
            args+=(-s "kickstart_rom_file_ext=$EXT")
          fi
          timeout 60s ./build-m4/frontend/sdl/fellowng-sdl "${args[@]}" 2>&1 | tee sdl-aros-m68k-deep-boot.log
          grep -q "runtime-boot-deep: sustained execution PASS" sdl-aros-m68k-deep-boot.log
          test -s fellowng-boot-evidence.ppm
          head -c 2 fellowng-boot-evidence.ppm | grep -q P6

      - name: AROS m68k extended desktop boot qualification
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          set -o pipefail
          ROM="$(cat build-m4/aros-m68k/rom-path.txt)"
          EXT="$(cat build-m4/aros-m68k/ext-path.txt)"
          args=(--runtime-boot-desktop -s "kickstart_rom_file=$ROM" -s "cpu_type=68020")
          if [ -n "$EXT" ]; then
            args+=(-s "kickstart_rom_file_ext=$EXT")
          fi
          timeout 120s ./build-m4/frontend/sdl/fellowng-sdl "${args[@]}" 2>&1 | tee sdl-aros-m68k-desktop.log
          grep -q "runtime-boot-desktop: sustained execution PASS" sdl-aros-m68k-desktop.log
          test -s fellowng-desktop-evidence.ppm
          head -c 2 fellowng-desktop-evidence.ppm | grep -q P6

      - name: Upload SDL diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdl-diagnostics
          path: |
            sdl-build.log
            sdl-self-test.log
            sdl-runtime-smoke.log
            sdl-aros-m68k.log
            sdl-aros-m68k-boot.log
            sdl-aros-m68k-deep-boot.log
            fellowng-boot-evidence.ppm
            sdl-aros-m68k-desktop.log
            fellowng-desktop-evidence.ppm
          if-no-files-found: warn
