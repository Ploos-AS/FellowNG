name: M6 Portable Windows SDL3

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  windows-sdl3:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SDL3
        uses: libsdl-org/setup-sdl@main
        with:
          version: 3.4.16

      - name: Configure portable SDL3 frontend
        shell: pwsh
        run: |
          cmake -S . -B build-m6 -DFELLOWNG_BUILD_SDL_FRONTEND=ON -DFELLOWNG_BUILD_TESTS=ON

      - name: Build portable SDL3 frontend
        shell: pwsh
        run: |
          cmake --build build-m6 --config Release --parallel

      - name: Locate frontend
        id: frontend
        shell: pwsh
        run: |
          $exe = Get-ChildItem build-m6 -Recurse -Filter fellowng-sdl.exe | Select-Object -First 1
          if (-not $exe) { throw "fellowng-sdl.exe not found" }
          "exe=$($exe.FullName)" >> $env:GITHUB_OUTPUT

      - name: Qualify CLI discovery
        shell: pwsh
        run: |
          $exe = "${{ steps.frontend.outputs.exe }}"
          $exeDir = Split-Path $exe
          $sdlDll = Get-ChildItem $env:SDL3_ROOT -Recurse -Filter SDL3.dll | Select-Object -First 1
          if (-not $sdlDll) { throw "SDL3.dll not found under SDL3_ROOT" }
          Copy-Item $sdlDll.FullName $exeDir -Force

          & $exe --help 2>&1 | Tee-Object -FilePath m6-windows-help.log
          $helpExit = $LASTEXITCODE
          if ($helpExit -ne 0) { throw "fellowng-sdl --help failed with exit code $helpExit" }

          & $exe --version 2>&1 | Tee-Object -FilePath m6-windows-version.log
          $versionExit = $LASTEXITCODE
          if ($versionExit -ne 0) { throw "fellowng-sdl --version failed with exit code $versionExit" }

      - name: Portable tests
        shell: pwsh
        run: |
          ctest --test-dir build-m6 -C Release --output-on-failure

      - name: Upload Windows portable diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m6-windows-sdl3
          path: |
            m6-windows-help.log
            m6-windows-version.log
