name: M9 Compatibility Probes

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  probe-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate M9 probe contract
        run: |
          set -euo pipefail
          python3 tools/validate_compat_probe_result.py tests/compat-probes/framework-pass.json
          python3 -m json.tool docs/schema/compat-probe-result-v1.schema.json >/dev/null
          grep -q 'fellowng.compat-probe-result.v1' docs/schema/compat-probe-result-v1.schema.json
          echo 'FellowNG M9.1 compatibility probe framework: PASS'

  cpu-probe-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install m68k binutils
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-m68k-linux-gnu
      - name: Validate and build M9.2a 68000 exception probe
        run: |
          set -euo pipefail
          python3 tools/stage_cpu_probe.py probes/cpu/m68000-exception-vectors-v1.json
          python3 tools/build_cpu_probe.py probes/cpu/m68000-exception-vectors-v1.S --output m68000-exception-vectors-v1.bin
          test -s m68000-exception-vectors-v1.bin
          python3 tools/stage_cpu_probe.py probes/cpu/m68000-exception-vectors-v1.json --image m68000-exception-vectors-v1.bin --output staged.bin
          cmp m68000-exception-vectors-v1.bin staged.bin
          echo 'FellowNG M9.2a CPU probe build: PASS'
      - name: Configure FellowNG CPU probe runner
        run: cmake -S . -B build -DFELLOWNG_BUILD_TESTS=ON -DFELLOWNG_BUILD_EMULATION_CORE=ON -DFELLOWNG_BUILD_SDL_FRONTEND=OFF
      - name: Build FellowNG CPU probe runner
        run: cmake --build build --target fellowng-cpu-probe-runner -j2
      - name: Execute M9.2a payload in FellowNG 68000 core
        run: |
          set -euo pipefail
          RUNNER="$(find build -type f -name fellowng-cpu-probe-runner -perm -111 | head -n1)"
          test -n "$RUNNER"
          set +e
          "$RUNNER" m68000-exception-vectors-v1.bin | tee m68000-exception-vectors-v1-result.json
          runner_status=${PIPESTATUS[0]}
          set -e
          python3 tools/validate_compat_probe_result.py m68000-exception-vectors-v1-result.json
          cat m68000-exception-vectors-v1-result.json
          test "$runner_status" -eq 0
          grep -q '"status":"PASS"' m68000-exception-vectors-v1-result.json
          grep -q '"name":"markers","value":"IDTP"' m68000-exception-vectors-v1-result.json
          echo 'FellowNG M9.2a real CPU execution: PASS'
      - name: Validate and build M9.2b 68000 address-error probe
        run: |
          set -euo pipefail
          python3 tools/stage_cpu_probe.py probes/cpu/m68000-address-error-v1.json
          python3 tools/build_cpu_probe.py probes/cpu/m68000-address-error-v1.S --output m68000-address-error-v1.bin
          test -s m68000-address-error-v1.bin
      - name: Build FellowNG address-error probe runner
        run: cmake --build build --target fellowng-address-error-probe-runner -j2
      - name: Execute M9.2b address-error payload in FellowNG 68000 core
        run: |
          set -euo pipefail
          RUNNER="$(find build -type f -name fellowng-address-error-probe-runner -perm -111 | head -n1)"
          test -n "$RUNNER"
          "$RUNNER" m68000-address-error-v1.bin | tee m68000-address-error-v1-result.json
          python3 tools/validate_compat_probe_result.py m68000-address-error-v1-result.json
          grep -q '"status":"PASS"' m68000-address-error-v1-result.json
          grep -q '"name":"markers","value":"A"' m68000-address-error-v1-result.json
          echo 'FellowNG M9.2b address-error execution: PASS'
      - name: Validate and build M9.2c 68000 interrupt probe
        run: |
          set -euo pipefail
          python3 tools/stage_cpu_probe.py probes/cpu/m68000-interrupt-level3-v1.json
          python3 tools/build_cpu_probe.py probes/cpu/m68000-interrupt-level3-v1.S --output m68000-interrupt-level3-v1.bin
          test -s m68000-interrupt-level3-v1.bin
      - name: Build FellowNG interrupt probe runner
        run: cmake --build build --target fellowng-interrupt-probe-runner -j2
      - name: Execute M9.2c level-3 interrupt payload in FellowNG 68000 core
        run: |
          set -euo pipefail
          RUNNER="$(find build -type f -name fellowng-interrupt-probe-runner -perm -111 | head -n1)"
          test -n "$RUNNER"
          "$RUNNER" m68000-interrupt-level3-v1.bin | tee m68000-interrupt-level3-v1-result.json
          python3 tools/validate_compat_probe_result.py m68000-interrupt-level3-v1-result.json
          grep -q '"status":"PASS"' m68000-interrupt-level3-v1-result.json
          grep -q '"name":"markers","value":"I"' m68000-interrupt-level3-v1-result.json
          echo 'FellowNG M9.2c level-3 interrupt execution: PASS'
      - name: Validate and build M9.2d 68020 VBR probe
        run: |
          set -euo pipefail
          python3 tools/stage_cpu_probe.py probes/cpu/m68020-vbr-trap-frame-v1.json
          python3 tools/build_cpu_probe.py probes/cpu/m68020-vbr-trap-frame-v1.S --cpu 68020 --output m68020-vbr-trap-frame-v1.bin
          test -s m68020-vbr-trap-frame-v1.bin
      - name: Build FellowNG 68020 probe runner
        run: cmake --build build --target fellowng-68020-probe-runner -j2
      - name: Execute M9.2d VBR payload in FellowNG 68020 core
        run: |
          set -euo pipefail
          RUNNER="$(find build -type f -name fellowng-68020-probe-runner -perm -111 | head -n1)"
          test -n "$RUNNER"
          "$RUNNER" m68020-vbr-trap-frame-v1.bin | tee m68020-vbr-trap-frame-v1-result.json
          python3 tools/validate_compat_probe_result.py m68020-vbr-trap-frame-v1-result.json
          grep -q '"status":"PASS"' m68020-vbr-trap-frame-v1-result.json
          grep -q '"name":"markers","value":"VR"' m68020-vbr-trap-frame-v1-result.json
          echo 'FellowNG M9.2d 68020 VBR/format-0 execution: PASS'
      - name: Build M9.3a chipset register probe runner
        run: cmake --build build --target fellowng-chipset-register-probe-runner -j2
      - name: Execute M9.3a chipset register semantics
        run: |
          set -euo pipefail
          RUNNER="$(find build -type f -name fellowng-chipset-register-probe-runner -perm -111 | head -n1)"
          test -n "$RUNNER"
          "$RUNNER" | tee chipset-pointer-registers-v1-result.json
          python3 tools/validate_compat_probe_result.py chipset-pointer-registers-v1-result.json
          grep -q '"status":"PASS"' chipset-pointer-registers-v1-result.json
          echo 'FellowNG M9.3a chipset register semantics: PASS'
      - name: Build M9.3b Copper execution probe runner
        run: cmake --build build --target fellowng-copper-execution-probe-runner -j2
      - name: Execute M9.3b Copper MOVE WAIT end probe
        run: |
          set -euo pipefail
          RUNNER="$(find build -type f -name fellowng-copper-execution-probe-runner -perm -111 | head -n1)"
          test -n "$RUNNER"
          timeout 10s "$RUNNER" | tee copper-move-wait-end-v1-result.json
          python3 tools/validate_compat_probe_result.py copper-move-wait-end-v1-result.json
          grep -q '"status":"PASS"' copper-move-wait-end-v1-result.json
          echo 'FellowNG M9.3b Copper execution: PASS'
      - name: Build M9.3c Blitter copy probe runner
        run: cmake --build build --target fellowng-blitter-copy-probe-runner -j2
      - name: Execute M9.3c Blitter A-to-D copy probe
        run: |
          set -euo pipefail
          RUNNER="$(find build -type f -name fellowng-blitter-copy-probe-runner -perm -111 | head -n1)"
          test -n "$RUNNER"
          timeout 10s "$RUNNER" | tee blitter-a-to-d-copy-v1-result.json
          python3 tools/validate_compat_probe_result.py blitter-a-to-d-copy-v1-result.json
          grep -q '"status":"PASS"' blitter-a-to-d-copy-v1-result.json
          echo 'FellowNG M9.3c Blitter A-to-D copy: PASS'
      - name: Build M9.3d bitplane DMA probe runner
        run: cmake --build build --target fellowng-bitplane-dma-probe-runner -j2
      - name: Execute M9.3d OCS lores bitplane DMA fetch
        run: |
          set -euo pipefail
          RUNNER="$(find build -type f -name fellowng-bitplane-dma-probe-runner -perm -111 | head -n1)"
          test -n "$RUNNER"
          timeout 10s "$RUNNER" | tee bitplane-lores-dma-fetch-v1-result.json
          python3 tools/validate_compat_probe_result.py bitplane-lores-dma-fetch-v1-result.json
          grep -q '"status":"PASS"' bitplane-lores-dma-fetch-v1-result.json
          echo 'FellowNG M9.3d OCS lores bitplane DMA fetch: PASS'
      - name: Build M9.3e sprite DMA probe runner
        run: cmake --build build --target fellowng-sprite-dma-probe-runner -j2
      - name: Execute M9.3e sprite register DMA probe
        run: |
          set -euo pipefail
          RUNNER="$(find build -type f -name fellowng-sprite-dma-probe-runner -perm -111 | head -n1)"
          test -n "$RUNNER"
          timeout 10s "$RUNNER" | tee sprite-register-dma-v1-result.json
          python3 tools/validate_compat_probe_result.py sprite-register-dma-v1-result.json
          grep -q '"status":"PASS"' sprite-register-dma-v1-result.json
          echo 'FellowNG M9.3e sprite register/DMA: PASS'
      - name: Build M9.3e sprite P2C probe runner
        run: cmake --build build --target fellowng-sprite-p2c-probe-runner -j2
      - name: Execute M9.3e sprite P2C decode probe
        run: |
          set -euo pipefail
          RUNNER="$(find build -type f -name fellowng-sprite-p2c-probe-runner -perm -111 | head -n1)"
          test -n "$RUNNER"
          timeout 10s "$RUNNER" | tee sprite-p2c-decode-v1-result.json
          python3 tools/validate_compat_probe_result.py sprite-p2c-decode-v1-result.json
          grep -q '"status":"PASS"' sprite-p2c-decode-v1-result.json
          echo 'FellowNG M9.3e sprite P2C decode: PASS'
      - name: Build M9.3f interrupt DMA probe runner
        run: cmake --build build --target fellowng-interrupt-dma-probe-runner -j2
      - name: Execute M9.3f interrupt DMA arbitration probe
        run: |
          set -euo pipefail
          RUNNER="$(find build -type f -name fellowng-interrupt-dma-probe-runner -perm -111 | head -n1)"
          test -n "$RUNNER"
          timeout 10s "$RUNNER" | tee interrupt-dma-arbitration-v1-result.json
          python3 tools/validate_compat_probe_result.py interrupt-dma-arbitration-v1-result.json
          grep -q '"status":"PASS"' interrupt-dma-arbitration-v1-result.json
          echo 'FellowNG M9.3f interrupt/DMA arbitration: PASS'
      - name: M9.3 qualification bundle
        run: |
          set -euo pipefail
          for result in             chipset-pointer-registers-v1-result.json             copper-move-wait-end-v1-result.json             blitter-a-to-d-copy-v1-result.json             bitplane-lores-dma-fetch-v1-result.json             sprite-register-dma-v1-result.json             sprite-p2c-decode-v1-result.json             interrupt-dma-arbitration-v1-result.json
            copper-bitplane-contention-v1-result.json
          do
            test -s "$result"
            python3 tools/validate_compat_probe_result.py "$result"
            grep -q '"status":"PASS"' "$result"
          done
          echo 'FellowNG M9.3 chipset qualification bundle: PASS'
      - name: Build M9.4a Copper bitplane contention probe
        run: cmake --build build --target fellowng-copper-bitplane-contention-probe-runner -j2
      - name: Execute M9.4a Copper bitplane contention probe
        run: |
          set -euo pipefail
          RUNNER="$(find build -type f -name fellowng-copper-bitplane-contention-probe-runner -perm -111 | head -n1)"
          test -n "$RUNNER"
          timeout 10s "$RUNNER" | tee copper-bitplane-contention-v1-result.json
          python3 tools/validate_compat_probe_result.py copper-bitplane-contention-v1-result.json
          grep -q '"status":"PASS"' copper-bitplane-contention-v1-result.json
          echo 'FellowNG M9.4a Copper/bitplane contention: PASS'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m68000-exception-vectors-v1
          path: |
            m68000-exception-vectors-v1.bin
            m68000-exception-vectors-v1-result.json
            m68000-address-error-v1.bin
            m68000-address-error-v1-result.json
            m68000-interrupt-level3-v1.bin
            m68000-interrupt-level3-v1-result.json
            m68020-vbr-trap-frame-v1.bin
            m68020-vbr-trap-frame-v1-result.json
            chipset-pointer-registers-v1-result.json
            copper-move-wait-end-v1-result.json
            blitter-a-to-d-copy-v1-result.json
            bitplane-lores-dma-fetch-v1-result.json
            sprite-register-dma-v1-result.json
            sprite-p2c-decode-v1-result.json
            interrupt-dma-arbitration-v1-result.json
